      background: #fff;
      color: #1a1a1a;

      display: inline-block;
      margin-bottom: 0.85rem;
      color: #2c6ad9;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a1a;
    }

      font-size: 0.9rem;
      color: #555;
      margin-top: 0.35rem;
    }

            <p>Calculator inputs are processed locally and are not transmitted to our servers.</p>
          </section>

            <p>The app stores non-personal preferences on your device using SharedPreferences, such as theme, language, launch counters, and ad timing controls.</p>

              <li><strong>INTERNET</strong> and <strong>ACCESS_NETWORK_STATE</strong>: required for ad and billing SDK connectivity.</li>
              <li><strong>VIBRATE</strong>: optional haptic feedback for key presses.</li>
            </ul>

    function applyLanguage(language) {
      const selected = translations[language] || translations.en;
      document.documentElement.lang = language;
      document.title = selected.pageTitle;

      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        if (selected[key]) {
          node.textContent = selected[key];
        }
      });

      document.querySelectorAll("[data-i18n-html]").forEach((node) => {
        const key = node.getAttribute("data-i18n-html");
        if (selected[key]) {
          node.innerHTML = selected[key];
        }
      });

      document.getElementById("policy-content").innerHTML = selected.sections;
    }

    function changeLanguage() {
      const selector = document.getElementById("language-selector");
      applyLanguage(selector.value);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const selector = document.getElementById("language-selector");
      const browserLanguage = (navigator.language || "en").slice(0, 2).toLowerCase();
      const initialLanguage = ["en", "pt", "es"].includes(browserLanguage) ? browserLanguage : "en";
      selector.value = initialLanguage;
      applyLanguage(initialLanguage);
    });
